services:
  toduck:
    image: ghcr.io/catduckgnaf/toduck:latest
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    ports:
      - "${TODUCK_BIND:-0.0.0.0}:${TODUCK_PORT:-8793}:8787"
    environment:
      TODUCK_TOKEN: ${TODUCK_TOKEN:?Set TODUCK_TOKEN to a random secret of at least 32 characters}
      TODUCK_ALLOWED_ORIGINS: ${TODUCK_ALLOWED_ORIGINS:-}
      PORT: 8787
      DATA_PATH: /data/state.json
      STATIC_DIR: /app/static
    volumes:
      - toduck-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/toduck-server", "--healthcheck", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  toduck-data:
